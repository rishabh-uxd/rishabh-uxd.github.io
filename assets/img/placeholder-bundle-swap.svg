<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-label="Placeholder: three phone treatments of a bundle swap card">
<defs>
  <linearGradient id="bs-a" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#146A47"/><stop offset="1" stop-color="#0E4E34"/>
  </linearGradient>
  <radialGradient id="bs-g1" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#146A47" stop-opacity="0.34"/><stop offset="1" stop-color="#146A47" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bs-g2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#0E4E34" stop-opacity="0.27"/><stop offset="1" stop-color="#0E4E34" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bs-g3" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#0E4E34" stop-opacity="0.32"/><stop offset="1" stop-color="#0E4E34" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="1100" fill="#E6DCC9"/>
<circle cx="300" cy="240" r="480" fill="url(#bs-g1)"/>
<circle cx="1340" cy="880" r="460" fill="url(#bs-g2)"/>
<circle cx="820" cy="560" r="420" fill="url(#bs-g3)"/>

<!-- left phone: search results -->
<g opacity=".82">
  <rect x="150" y="250" width="330" height="600" rx="40" fill="#FFFFFF" stroke="#146A47" stroke-opacity=".35" stroke-width="2"/>
  <rect x="186" y="300" width="258" height="40" rx="20" fill="#191409" fill-opacity=".10"/>
  <g fill="#191409" fill-opacity=".07">
    <rect x="186" y="366" width="258" height="130" rx="16"/>
    <rect x="186" y="516" width="258" height="130" rx="16"/>
    <rect x="186" y="666" width="258" height="130" rx="16"/>
  </g>
  <g fill="url(#bs-a)">
    <rect x="202" y="390" width="86" height="82" rx="10" opacity=".8"/>
    <rect x="202" y="540" width="86" height="82" rx="10" opacity=".55"/>
    <rect x="202" y="690" width="86" height="82" rx="10" opacity=".35"/>
  </g>
  <g fill="#191409" fill-opacity=".22">
    <rect x="304" y="396" width="124" height="12" rx="6"/><rect x="304" y="420" width="90" height="12" rx="6"/>
    <rect x="304" y="546" width="124" height="12" rx="6"/><rect x="304" y="570" width="90" height="12" rx="6"/>
    <rect x="304" y="696" width="124" height="12" rx="6"/><rect x="304" y="720" width="90" height="12" rx="6"/>
  </g>
</g>

<!-- center phone: the swap card -->
<g>
  <rect x="580" y="170" width="440" height="790" rx="52" fill="#FFFFFF" stroke="url(#bs-a)" stroke-width="3"/>
  <rect x="624" y="226" width="352" height="44" rx="22" fill="#191409" fill-opacity=".10"/>
  <rect x="624" y="298" width="352" height="300" rx="24" fill="url(#bs-a)" opacity=".16"/>
  <rect x="624" y="298" width="352" height="300" rx="24" fill="none" stroke="url(#bs-a)" stroke-width="2"/>
  <rect x="656" y="330" width="130" height="130" rx="14" fill="url(#bs-a)" opacity=".85"/>
  <g fill="#191409" fill-opacity=".85">
    <rect x="806" y="338" width="140" height="14" rx="7"/>
    <rect x="806" y="366" width="104" height="14" rx="7" fill-opacity=".45"/>
  </g>
  <rect x="806" y="404" width="80" height="26" rx="13" fill="#0B7B3C" opacity=".85"/>
  <g fill="#191409" fill-opacity=".2">
    <rect x="656" y="490" width="290" height="12" rx="6"/>
    <rect x="656" y="514" width="230" height="12" rx="6"/>
  </g>
  <rect x="656" y="548" width="290" height="30" rx="15" fill="#191409" fill-opacity=".08"/>
  <rect x="624" y="630" width="352" height="56" rx="28" fill="url(#bs-a)"/>
  <rect x="624" y="704" width="352" height="56" rx="28" fill="none" stroke="#191409" stroke-opacity=".25" stroke-width="2"/>
  <g fill="#191409" fill-opacity=".14">
    <rect x="624" y="796" width="352" height="12" rx="6"/>
    <rect x="624" y="826" width="260" height="12" rx="6"/>
  </g>
</g>

<!-- right phone: cart -->
<g opacity=".82">
  <rect x="1120" y="250" width="330" height="600" rx="40" fill="#FFFFFF" stroke="#0E4E34" stroke-opacity=".35" stroke-width="2"/>
  <rect x="1156" y="300" width="160" height="26" rx="13" fill="#191409" fill-opacity=".18"/>
  <g fill="#191409" fill-opacity=".07">
    <rect x="1156" y="352" width="258" height="160" rx="16"/>
    <rect x="1156" y="532" width="258" height="160" rx="16"/>
  </g>
  <rect x="1176" y="376" width="96" height="112" rx="10" fill="url(#bs-a)" opacity=".7"/>
  <rect x="1176" y="556" width="96" height="112" rx="10" fill="url(#bs-a)" opacity=".45"/>
  <g fill="#191409" fill-opacity=".22">
    <rect x="1290" y="382" width="106" height="12" rx="6"/><rect x="1290" y="406" width="76" height="12" rx="6"/>
    <rect x="1290" y="562" width="106" height="12" rx="6"/><rect x="1290" y="586" width="76" height="12" rx="6"/>
  </g>
  <rect x="1156" y="720" width="258" height="48" rx="24" fill="#6CCBA0" opacity=".85"/>
</g>

<!-- connector -->
<path d="M480 550 L580 550" stroke="url(#bs-a)" stroke-width="3" stroke-dasharray="10 10"/>
<path d="M1020 550 L1120 550" stroke="url(#bs-a)" stroke-width="3" stroke-dasharray="10 10"/>

<g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" letter-spacing="3" fill="#7A6E55">
  <text x="150" y="930">SEARCH</text>
  <text x="580" y="1020">3 CX TREATMENTS</text>
  <text x="1120" y="930">CART</text>
</g>
</svg>
