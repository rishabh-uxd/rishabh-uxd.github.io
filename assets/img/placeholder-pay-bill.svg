<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-label="Placeholder: payment amount selection beside the interest slider concept">
<defs>
  <linearGradient id="pb-a" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#146A47"/><stop offset="1" stop-color="#0E4E34"/>
  </linearGradient>
  <linearGradient id="pb-track" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6CCBA0"/><stop offset="0.55" stop-color="#146A47"/><stop offset="1" stop-color="#0E4E34"/>
