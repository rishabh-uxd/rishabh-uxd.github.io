<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette comparison · Rishabh Singh portfolio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<!--
  DEV HARNESS, NOT PART OF THE SITE.
  Loads index.html in an iframe and swaps one palette stylesheet so every
  option is judged on the identical layout, copy, and motion. Scroll position
  is kept across swaps, so you can park on a card and flip through colors.

  When a palette is picked: fold its values into tokens.css, delete the
  PREVIEW ONLY block at the bottom of the palette file, recolor the artwork in
  assets/img/, then delete this file and assets/css/palettes/.
-->
<style>
  :root {
    --ui-bg: #17191C;
    --ui-raised: #23262B;
    --ui-text: #F2F3F5;
    --ui-dim: #A2A7B0;
    --ui-stroke: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--ui-bg); color: var(--ui-text);
    font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .bar {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 8px 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--ui-stroke);
    background: var(--ui-raised);
  }
  .bar h1 { font-size: 13px; font-weight: 600; margin: 0 6px 0 0; letter-spacing: -0.01em; }
  .bar .hint { color: var(--ui-dim); font-size: 12px; margin-left: auto; }

  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }

  .sw {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 8px;
    border: 1px solid var(--ui-stroke); border-radius: 999px;
    background: transparent; color: var(--ui-text);
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .sw:hover { background: rgba(255,255,255,0.07); }
  .sw:focus-visible { outline: 2px solid #6FA8FF; outline-offset: 2px; }
  .sw[aria-pressed="true"] { background: #FFFFFF; color: #17191C; border-color: #FFFFFF; font-weight: 600; }

  /* Two dots per swatch: the paper and the accent. */
  .sw .chip { display: inline-flex; }
  .sw .chip i {
    display: block; width: 13px; height: 13px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.25);
  }
  .sw .chip i + i { margin-left: -5px; }

  .frame { flex: 1; min-height: 0; border: 0; width: 100%; background: #fff; }
</style>
</head>
<body>

<div class="bar">
  <h1>Palette comparison</h1>
  <div class="swatches" id="swatches" role="group" aria-label="Choose a palette"></div>
  <p class="hint">Same page, same copy. Only the tokens change.</p>
</div>

<iframe class="frame" id="frame" src="index.html" title="Portfolio home page preview"></iframe>

<script>
(function () {
  // paper = background dot, accent = accent dot. Kept in sync with the files
  // in assets/css/palettes/ purely so the swatches look right in this bar.
  var PALETTES = [
    { id: '',       name: 'Ember (current)', paper: '#FBF7F1', accent: '#C8401F' },
    { id: 'forest', name: 'Forest',          paper: '#F5F2E9', accent: '#146A47' },
    { id: 'sand',   name: 'Sand + forest',   paper: '#EDE4D6', accent: '#146A47' },
    { id: 'petrol', name: 'Petrol',          paper: '#F7F5F1', accent: '#0E6A73' },
    { id: 'cobalt', name: 'Cobalt',          paper: '#FAF6EE', accent: '#1A56C4' },
    { id: 'indigo', name: 'Indigo',          paper: '#F5F4F8', accent: '#4A3AD4' },
    { id: 'plum',   name: 'Plum',            paper: '#FAF3F1', accent: '#9C2B63' }
  ];

  var frame = document.getElementById('frame');
  var bar = document.getElementById('swatches');
  var current = '';

  PALETTES.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sw';
    b.setAttribute('aria-pressed', p.id === current ? 'true' : 'false');
    b.dataset.id = p.id;
    b.innerHTML = '<span class="chip" aria-hidden="true">' +
      '<i style="background:' + p.paper + '"></i>' +
      '<i style="background:' + p.accent + '"></i></span>' + p.name;
    b.addEventListener('click', function () { select(p.id); });
    bar.appendChild(b);
  });

  function select(id) {
    current = id;
    Array.prototype.forEach.call(bar.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.id === id ? 'true' : 'false');
    });
    apply();
  }

  function apply() {
    var doc = frame.contentDocument;
    if (!doc) return;
    var link = doc.getElementById('palette-override');
    if (current) {
      if (!link) {
        link = doc.createElement('link');
        link.rel = 'stylesheet';
        link.id = 'palette-override';
        doc.head.appendChild(link);
      }
      link.href = 'assets/css/palettes/' + current + '.css';
      doc.documentElement.classList.add('palette-preview');
    } else if (link) {
      link.remove();
      doc.documentElement.classList.remove('palette-preview');
    }
  }

  // Re-apply if the iframe navigates or reloads.
  frame.addEventListener('load', apply);
})();
</script>
</body>
</html>
